<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Kelompok</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        nav {
            padding: 20px;
            background-color: #1e3a8a;
            color: white;
        }

        .produk {
            padding: 40px 20px;
            text-align: center;
        }

        .produk-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .produk-card {
            width: 200px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: #f8fafc;
        }

        .produk-card h3 {
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <!-- Navbar dari Siswa A -->
    <nav>
        <h2>Website Kelompok</h2>
    </nav>

    <!-- Products Section - Tugas Siswa B -->
    <section class="produk" id="produk">

<h2>Produk Pilihan Kami</h2>
        
        <p>Berikut adalah beberapa produk pilihan kami.</p>

        <div class="produk-container">

            <div class="produk-card">
                <h3>Produk 1</h3>
                <p>Deskripsi produk pertama.</p>
            </div>

            <div class="produk-card">
                <h3>Produk 2</h3>
                <p>Deskripsi produk kedua.</p>
            </div>

            <div class="produk-card">
                <h3>Produk 3</h3>
                <p>Deskripsi produk ketiga.</p>
            </div>

        </div>

    </section>

</body>
</html>
